name: GitHub-Profile-Summary-Cards

on:
  schedule:
    # Regenerate the cards once a day (00:00 UTC)
    - cron: "0 0 * * *"
  workflow_dispatch:        # lets you run it manually from the Actions tab
  push:
    branches:
      - main               # also run on every push to main

jobs:
  build:
    runs-on: ubuntu-latest
    name: generate-github-profile-summary-cards
    permissions:
      contents: write      # needed so the action can commit the generated SVGs

    steps:
      - uses: actions/checkout@v4

      - uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          # Create a Personal Access Token (classic, "repo" scope is enough)
          # and add it to this repo's Settings > Secrets and variables > Actions
          # as a secret named SUMMARY_GITHUB_TOKEN.
          # A PAT (not the default GITHUB_TOKEN) is required so private repos are counted,
          # matching your old count_private=true setting.
          GITHUB_TOKEN: ${{ secrets.SUMMARY_GITHUB_TOKEN }}
        with:
          USERNAME: ${{ github.repository_owner }}   # -> DangerBlack
          BRANCH_NAME: "main"                          # change to "master" if that's your default branch
          UTC_OFFSET: 1                                # Italy (CET); only affects the productive-time card
          AUTO_PUSH: true